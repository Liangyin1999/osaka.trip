<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var STORE = "osk-lock-key-v1";
  var form = document.getElementById("form");
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");

  function fromB64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function storeGet() { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } }
  function storeSet(v) { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {} }

  function deriveBits(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", salt: fromB64(P.s), iterations: P.n, hash: "SHA-256" }, base, 256);
      });
  }
  function decrypt(bits) {
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"])
      .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(P.i) }, key, fromB64(P.d)); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = "這個瀏覽器無法解鎖，請用 Chrome 或 Safari 以 https 網址開啟。";
    btn.disabled = true;
    return;
  }

  // 記住過的裝置：金鑰與鹽值都對得上就直接打開
  var saved = storeGet();
  if (saved && saved.s === P.s && saved.k) {
    decrypt(fromB64(saved.k)).then(show, function () { storeSet(null); });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    var remember = document.getElementById("remember").checked;
    btn.disabled = true;
    msg.textContent = "";
    btn.textContent = "解鎖中…";
    var bits;
    deriveBits(pw)
      .then(function (b) { bits = b; return decrypt(b); })
      .then(function (html) {
        storeSet(remember ? { s: P.s, k: toB64(bits) } : null);
        show(html);
      }, function () {
        btn.disabled = false;
        btn.textContent = "解鎖";
        msg.textContent = "密碼不對，再試一次。";
      });
  });
})();
</script>
